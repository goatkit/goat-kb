<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Background rounded square -->
  <rect x="8" y="8" width="240" height="240" rx="40" fill="#f3e8ff"/>
  
  <!-- Open book: left page -->
  <path d="M128 195c-20-5-45-8-68-8-12 0-24 1-36 3V68c12-2 24-3 36-3 23 0 48 3 68 8v122z" 
        fill="#7c3aed" opacity="0.85"/>
  
  <!-- Open book: right page -->
  <path d="M128 195c20-5 45-8 68-8 12 0 24 1 36 3V68c-12-2-24-3-36-3-23 0-48 3-68 8v122z" 
        fill="#6d28d9" opacity="0.85"/>
  
  <!-- Book spine/center fold -->
  <line x1="128" y1="65" x2="128" y2="195" stroke="#5b21b6" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Page lines on left -->
  <line x1="142" y1="95" x2="180" y2="95" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" opacity="0.25"/>
  <line x1="142" y1="110" x2="175" y2="110" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" opacity="0.25"/>
  <line x1="142" y1="125" x2="170" y2="125" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" opacity="0.25"/>
  
  <!-- Knowledge sparkle / article icon above book -->
  <g transform="translate(128, 42)" fill="#a855f7">
    <path d="M0-4L2-1h4L3 1l1 4-4-2-4 2 1-4-4-2h4z" fill="#8b5cf6"/>
  </g>
  
  <!-- Bookmark ribbon -->
  <path d="M100 65v-20c0-4 4-8 8-8h40c4 0 8 4 8 8v20l-28-10-28 10z" 
        fill="#e879f9" opacity="0.6"/>
  
  <!-- Pages peeking from center -->
  <path d="M128 175c-10-2-22-4-32-4-8 0-16 1-24 2" 
        fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M128 165c-10-2-22-4-32-4-8 0-16 1-24 2" 
        fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
